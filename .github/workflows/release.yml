name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    # Debian 11 => glibc 2.31: the AppImage runs on Ubuntu 20.04+, Debian 11+,
    # Fedora 32+, and other distributions of that age or newer.
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v5

      - name: Build AppImage
        run: ./scripts/build_release.sh

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --version
          "$app" --check

      - name: Stage assets
        run: |
          mkdir -p out
          cp dist/*.AppImage out/
          cd out && sha256sum *.AppImage > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: psone2ps3pkg-appimage
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
