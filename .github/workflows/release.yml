name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-binary:
    # 22.04 => glibc 2.35, so the binary runs on reasonably old distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc

      - name: Build standalone binary
        run: ./scripts/build_release.sh

      - name: Smoke test
        run: |
          dist/psone2ps3pkg --version
          dist/psone2ps3pkg --check

      - name: Stage asset
        run: |
          mkdir -p out
          cp dist/psone2ps3pkg out/psone2ps3pkg-linux-x86_64
          ( cd out && sha256sum psone2ps3pkg-linux-x86_64 > psone2ps3pkg-linux-x86_64.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: psone2ps3pkg-linux-x86_64
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
